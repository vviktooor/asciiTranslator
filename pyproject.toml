[project]
name = "ascii-translator"
version = "2.0.0"
description = "Desktop app that converts text to ASCII codes and back (EN/PL). Author: WR"
requires-python = ">=3.10"
dependencies = ["customtkinter==5.2.2", "pillow>=10"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".github/wr"]  # vendored WR gate, updated from the skill

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools.package-data]
ascii_translator = ["locales/*.json", "assets/*.png"]
